<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>curatedz Reader</title>
  <style>
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#f5f7fa;--surface:#fff;--surface-muted:#eef1f5;--text:#16202a;--muted:#5e6a76;--border:#d6dce3;--accent:#1769e0;--accent-hover:#0f55bb;--error:#b42318;--shadow:0 8px 28px rgb(15 23 42 / 8%)}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--surface:#161b22;--surface-muted:#21262d;--text:#f0f3f6;--muted:#9da7b3;--border:#30363d;--accent:#58a6ff;--accent-hover:#79b8ff;--error:#ff7b72;--shadow:0 8px 28px rgb(0 0 0 / 25%)}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.55}a{color:var(--accent)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.65}
    .shell{width:min(100% - 2rem,1080px);margin:0 auto;padding:2.25rem 0 4rem}header{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1.5rem}h1{margin:0;font-size:clamp(1.75rem,4vw,2.4rem);letter-spacing:-.035em}header p{margin:.25rem 0 0;color:var(--muted)}.eyebrow{color:var(--muted);font-size:.875rem;white-space:nowrap}
    .search-panel{padding:1rem;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}form{display:grid;grid-template-columns:minmax(14rem,2fr) repeat(4,minmax(8rem,1fr));gap:.75rem;align-items:end}label{display:grid;gap:.35rem;color:var(--muted);font-size:.82rem;font-weight:650}input,select{width:100%;min-height:44px;padding:.65rem .75rem;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}.actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:.85rem}.button{min-height:42px;padding:.6rem 1rem;border:1px solid transparent;border-radius:8px;background:var(--accent);color:#fff;font-weight:700}.button:hover{background:var(--accent-hover)}.button-secondary{border-color:var(--border);background:transparent;color:var(--text)}.button-secondary:hover{background:var(--surface-muted)}
    .summary{min-height:3.25rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem .15rem .5rem;color:var(--muted)}.summary.error{color:var(--error)}.summary strong{color:var(--text)}.summary.error strong{color:var(--error)}.retry{border:0;padding:.35rem .6rem;background:transparent;color:inherit;font-weight:700;text-decoration:underline}
    #results{display:grid;gap:.75rem}article{padding:1.15rem 1.25rem;border:1px solid var(--border);border-radius:12px;background:var(--surface);box-shadow:0 2px 10px rgb(15 23 42 / 4%)}article.is-read{opacity:.68}article h2{margin:0;font-size:1.08rem;line-height:1.45}article h2 a{color:var(--text);text-decoration:none}article h2 a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:.18em}.meta{display:flex;flex-wrap:wrap;gap:.35rem .8rem;margin-top:.45rem;color:var(--muted);font-size:.82rem}.excerpt{margin:.65rem 0 0;color:var(--muted)}.article-actions{display:flex;justify-content:flex-end;margin-top:.8rem}.read-button{min-height:36px;padding:.4rem .7rem;font-size:.82rem}.badge{padding:.08rem .45rem;border-radius:999px;background:var(--surface-muted)}
    .empty{padding:3rem 1rem;border:1px dashed var(--border);border-radius:12px;background:var(--surface);color:var(--muted);text-align:center}.empty strong{display:block;margin-bottom:.25rem;color:var(--text);font-size:1.05rem}.skeleton{height:8.5rem;border-radius:12px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface-muted) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.25s infinite linear}@keyframes shimmer{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.skeleton{animation:none}}#more{display:block;margin:1.25rem auto 0}#more[hidden]{display:none}
    @media(max-width:820px){.shell{width:min(100% - 1.25rem,1080px);padding-top:1.25rem}header{display:block}.eyebrow{display:block;margin-top:.4rem}form{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}
    @media(max-width:520px){form{grid-template-columns:1fr}.wide{grid-column:auto}.actions{display:grid;grid-template-columns:1fr 1fr}article{padding:1rem}.summary{align-items:start}}
  </style>
</head>
<body>
  <div class="shell">
    <header><div><h1>curatedz Reader</h1><p>集めた記事を、新着順と全文検索で読む。</p></div><span class="eyebrow">新着記事と全文検索</span></header>
    <section class="search-panel" aria-labelledby="search-heading">
      <h2 id="search-heading" hidden>記事を検索</h2>
      <form id="search">
        <label class="wide">キーワード<input name="q" type="search" maxlength="200" placeholder="空欄で新着順" autocomplete="off"></label>
        <label>Topic<select name="topic" id="topic"><option value="">すべてのtopic</option></select></label>
        <label>既読状態<select name="read"><option value="unread" selected>未読</option><option value="read">既読</option><option value="all">すべて</option></select></label>
        <label>開始日<input name="date_from" type="date"></label>
        <label>終了日<input name="date_to" type="date"></label>
      </form>
      <div class="actions"><button class="button button-secondary" id="reset" type="button">条件を戻す</button><button class="button" id="submit" type="submit" form="search">記事を表示</button></div>
    </section>
    <div id="status" class="summary" role="status" aria-live="polite"></div>
    <main id="results" aria-busy="false"></main>
    <button id="more" class="button button-secondary" type="button" hidden>さらに表示</button>
  </div>
  <script>
    const form=document.querySelector('#search'),status=document.querySelector('#status'),results=document.querySelector('#results'),more=document.querySelector('#more'),submit=document.querySelector('#submit'),reset=document.querySelector('#reset'),topicSelect=document.querySelector('#topic');let page=0,total=0,loading=false,topicNames=new Map();
    const localDate=date=>[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
    function setDefaultDates(){const today=new Date(),weekStart=new Date(today);weekStart.setDate(today.getDate()-6);form.elements.date_from.value=localDate(weekStart);form.elements.date_to.value=localDate(today)}
    const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
    function safeUrl(value){try{const url=new URL(value);return['http:','https:'].includes(url.protocol)?escapeHtml(url.href):'#'}catch{return'#'}}
    const renderArticle=item=>`<article data-article-id="${escapeHtml(item.article_id)}" class="${item.read_at?'is-read':''}"><h2><a class="article-link" href="${safeUrl(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title||'(無題)')}</a></h2><div class="meta"><time>${escapeHtml(item.published_at||'日付不明')}</time>${(item.topic_ids||[]).map(id=>`<span class="badge">${escapeHtml(topicNames.get(id)||id)}</span>`).join('')}</div>${item.excerpt?`<p class="excerpt">${escapeHtml(item.excerpt)}</p>`:''}<div class="article-actions"><button class="button button-secondary read-button" type="button" data-read="${item.read_at?'true':'false'}">${item.read_at?'未読に戻す':'既読にする'}</button></div></article>`;
    function renderLoading(append){status.className='summary';status.textContent=append?'さらに読み込んでいます…':'記事を読み込んでいます…';if(!append)results.innerHTML='<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>'}
    function renderEmpty(){results.innerHTML='<div class="empty"><strong>該当する記事はありません</strong>検索条件や日付範囲を変更してください。</div>';status.textContent='0件'}
    function renderError(error){results.innerHTML='<div class="empty"><strong>記事を表示できませんでした</strong>しばらく待ってから、もう一度お試しください。</div>';status.className='summary error';status.innerHTML=`<strong>${escapeHtml(error.message)}</strong><button class="retry" type="button">再試行</button>`;status.querySelector('.retry').addEventListener('click',()=>load())}
    async function loadTopics(){const response=await fetch('/api/topics');if(!response.ok)throw new Error('topicを取得できません');const topics=await response.json();topicNames=new Map(topics.map(topic=>[topic.id,topic.name]));topicSelect.insertAdjacentHTML('beforeend',topics.map(topic=>`<option value="${escapeHtml(topic.id)}">${escapeHtml(topic.name)}</option>`).join(''))}
    async function setRead(article,read){const id=article.dataset.articleId,button=article.querySelector('.read-button');button.disabled=true;try{const response=await fetch(`/api/articles/${encodeURIComponent(id)}/read`,{method:read?'PUT':'DELETE'});if(!response.ok)throw new Error('既読状態を更新できません');if(form.elements.read.value==='unread'&&read||form.elements.read.value==='read'&&!read){page=0;await load();return}article.classList.toggle('is-read',read);button.dataset.read=String(read);button.textContent=read?'未読に戻す':'既読にする'}catch(error){status.className='summary error';status.textContent=error.message}finally{button.disabled=false}}
    async function load(append=false){if(loading)return;loading=true;submit.disabled=true;more.hidden=true;results.setAttribute('aria-busy','true');renderLoading(append);try{const params=new URLSearchParams(new FormData(form));for(const[key,value]of[...params])if(!value)params.delete(key);params.set('page',String(page));params.set('size','20');const response=await fetch(`/api/search?${params}`);if(!response.ok){const detail=await response.text();if(response.status===401)throw new Error('ログインの有効期限が切れました。ページを再読み込みしてください。');if(response.status===400&&detail)throw new Error(detail);throw new Error('記事の取得に失敗しました')}const data=await response.json();total=data.total;if(!append)results.textContent='';if(append)results.insertAdjacentHTML('beforeend',data.items.map(renderArticle).join(''));else results.innerHTML=data.items.map(renderArticle).join('');if(total===0)renderEmpty();else{status.className='summary';status.innerHTML=`<span><strong>${total}件</strong>中 ${results.children.length}件を表示</span>`}more.hidden=results.children.length>=total||data.items.length===0}catch(error){renderError(error)}finally{loading=false;submit.disabled=false;results.setAttribute('aria-busy','false')}}
    form.addEventListener('submit',event=>{event.preventDefault();page=0;load()});more.addEventListener('click',()=>{page+=1;load(true)});reset.addEventListener('click',()=>{form.reset();setDefaultDates();page=0;load()});results.addEventListener('click',event=>{const article=event.target.closest('article');if(!article)return;if(event.target.closest('.read-button')){const read=event.target.dataset.read!=='true';void setRead(article,read)}else if(event.target.closest('.article-link')&&!article.classList.contains('is-read'))void setRead(article,true)});setDefaultDates();loadTopics().then(()=>load()).catch(renderError);
  </script>
</body>
</html>
