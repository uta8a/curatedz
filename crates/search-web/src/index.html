<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>curatedz</title><style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{max-width:960px;margin:auto;padding:1rem}header{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:.5rem}input,button{font:inherit;padding:.7rem}button{cursor:pointer}article{border-bottom:1px solid #8886;padding:1rem 0}h2{font-size:1.15rem;margin:.2rem 0}small{opacity:.72}.excerpt{line-height:1.5}.error{color:#c33}#more{display:block;margin:1.5rem auto}#more[hidden]{display:none}@media(max-width:700px){header{display:block}form{grid-template-columns:1fr}button{width:100%}}
</style></head><body><header><h1>curatedz Reader</h1><small>新着記事と全文検索</small></header><form id="search"><input name="q" type="search" maxlength="200" placeholder="キーワード（空欄で新着順）"><input name="source" maxlength="100" placeholder="情報源ID"><input name="date_from" type="date"><input name="date_to" type="date"><button>表示</button></form><p id="status" aria-live="polite"></p><main id="results"></main><button id="more" type="button" hidden>さらに表示</button><script>
const form=document.querySelector('#search'),status=document.querySelector('#status'),results=document.querySelector('#results'),more=document.querySelector('#more');let page=0,total=0,loading=false;const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=new Date(),weekStart=new Date(today);weekStart.setDate(today.getDate()-6);form.elements.date_from.value=localDate(weekStart);form.elements.date_to.value=localDate(today);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const render=x=>`<article><h2><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.title||'(無題)')}</a></h2><small>${esc(x.published_at||'日付不明')} · ${esc((x.source_ids||[]).join(', '))}</small><p class="excerpt">${esc(x.excerpt||'')}</p></article>`;async function load(append=false){if(loading)return;loading=true;status.className='';status.textContent=append?'読み込み中…':'記事を読み込み中…';if(!append)results.textContent='';more.hidden=true;try{const p=new URLSearchParams(new FormData(form));for(const [key,value] of [...p])if(!value)p.delete(key);p.set('page',String(page));p.set('size','20');const r=await fetch('/api/search?'+p);if(!r.ok)throw new Error('記事の取得に失敗しました');const data=await r.json();total=data.total;if(append)results.insertAdjacentHTML('beforeend',data.items.map(render).join(''));else results.innerHTML=data.items.map(render).join('');status.textContent=`${total}件中 ${results.children.length}件を表示`;more.hidden=results.children.length>=total||data.items.length===0}catch(e){status.className='error';status.textContent=e.message}finally{loading=false}}form.addEventListener('submit',e=>{e.preventDefault();page=0;load()});more.addEventListener('click',()=>{page+=1;load(true)});load();
</script></body></html>
