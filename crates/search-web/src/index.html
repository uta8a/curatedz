<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>curatedz</title><style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{max-width:960px;margin:auto;padding:1rem}form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:.5rem}input,button{font:inherit;padding:.7rem}article{border-bottom:1px solid #8886;padding:1rem 0}h2{font-size:1.15rem;margin:.2rem 0}small{opacity:.72}.excerpt{line-height:1.5}.error{color:#c33}@media(max-width:700px){form{grid-template-columns:1fr}button{width:100%}}
</style></head><body><h1>curatedz</h1><form id="search"><input name="q" type="search" required maxlength="200" placeholder="キーワード"><input name="source" maxlength="100" placeholder="情報源ID"><input name="date_from" type="date"><input name="date_to" type="date"><button>検索</button></form><p id="status"></p><main id="results"></main><script>
const form=document.querySelector('#search'),status=document.querySelector('#status'),results=document.querySelector('#results');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));form.addEventListener('submit',async e=>{e.preventDefault();status.className='';status.textContent='検索中…';results.textContent='';try{const p=new URLSearchParams(new FormData(form));const r=await fetch('/api/search?'+p);if(!r.ok)throw new Error('検索に失敗しました');const data=await r.json();status.textContent=`${data.total}件`;results.innerHTML=data.items.map(x=>`<article><h2><a href="${esc(x.url)}" rel="noopener noreferrer">${esc(x.title||'(無題)')}</a></h2><small>${esc(x.published_at||'日付不明')} · ${esc((x.source_ids||[]).join(', '))}</small><p class="excerpt">${esc(x.excerpt||'')}</p></article>`).join('')}catch(e){status.className='error';status.textContent=e.message}});
</script></body></html>
