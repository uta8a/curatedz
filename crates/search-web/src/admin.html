<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>curatedz 管理</title><style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{max-width:760px;margin:auto;padding:1rem}header{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}a{color:inherit}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.card{border:1px solid #8886;border-radius:.6rem;padding:1rem}.value{font-size:1.5rem;font-weight:700}.muted{opacity:.7}.error{color:#c33}button{font:inherit;padding:.6rem .9rem;cursor:pointer}@media(max-width:600px){header{display:block}.grid{grid-template-columns:1fr}}
</style></head><body><header><div><h1>curatedz 管理</h1><p class="muted">読み取り専用の稼働状況</p></div><a href="/">Readerへ戻る</a></header><p><button id="reload" type="button">再読み込み</button></p><p id="message" aria-live="polite">管理情報を読み込み中…</p><main id="content" class="grid" hidden><section class="card"><h2>OpenSearch</h2><p>状態: <strong id="health"></strong></p><p>ノード: <span id="nodes"></span></p><p>Primary shard: <span id="primary"></span></p><p>未割当shard: <span id="unassigned"></span></p></section><section class="card"><h2>記事</h2><p class="value"><span id="total"></span>件</p><p>最新公開日時: <span id="published"></span></p><p>最終発見日時: <span id="seen"></span></p></section></main><p id="generated" class="muted"></p><script>
const message=document.querySelector('#message'),content=document.querySelector('#content'),generated=document.querySelector('#generated'),text=(id,value)=>document.querySelector(id).textContent=value??'データなし',date=value=>value?new Date(value).toLocaleString('ja-JP'):'データなし';async function load(){message.className='';message.textContent='管理情報を読み込み中…';content.hidden=true;generated.textContent='';try{const response=await fetch('/api/admin/status');if(!response.ok)throw new Error('管理情報を取得できません');const data=await response.json();text('#health',data.search.status);text('#nodes',data.search.number_of_nodes);text('#primary',data.search.active_primary_shards);text('#unassigned',data.search.unassigned_shards);text('#total',data.articles.total);text('#published',date(data.articles.latest_published_at));text('#seen',date(data.articles.latest_seen_at));generated.textContent=`取得日時: ${date(data.generated_at)}`;message.textContent='';content.hidden=false}catch(error){message.className='error';message.textContent=error.message}}document.querySelector('#reload').addEventListener('click',load);load();
</script></body></html>
