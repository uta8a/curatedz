[workspace]
members = ["crates/core", "crates/cli", "crates/collector-lambda"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = { version = "=0.1.92" }
chrono = { version = "=0.4.45", features = ["serde"] }
clap = { version = "=4.6.7", features = ["derive"] }
feed-rs = { version = "=3.0.0" }
fs2 = { version = "=0.4.3" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154" }
serde_yaml_ng = { version = "=0.10.0" }
sha2 = { version = "=0.11.1" }
thiserror = { version = "=2.0.21" }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tracing = { version = "=0.1.44" }
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
url = { version = "=2.5.8" }
aws-config = { version = "=1.13.0" }
aws-sdk-s3 = { version = "=1.155.0", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
lambda_runtime = { version = "=1.5.0" }
tempfile = { version = "=3.27.0" }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
